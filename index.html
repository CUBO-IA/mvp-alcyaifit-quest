<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>AlcyAIFit Quest</title>
<style>
:root{--pink:#ff3d8f;--bg:#0b0b10;--card:#16161f;--line:#2a2a38;--text:#f5f5f7;--mute:#a8a8b8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px}
header b{font-size:18px;display:block}header small{color:var(--mute)}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--pink);background:var(--card)}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);color:var(--text);border:2px solid var(--c);border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--c);color:#0b0b10;font-weight:700}.chip:disabled{opacity:.45;border-color:var(--line)}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:18px;font-weight:700}
.lv.done{border-color:var(--pink);color:var(--pink)}.lv.now{background:var(--pink);color:#0b0b10;border-color:var(--pink)}.lv:disabled{opacity:.4}
button{font:inherit;cursor:pointer}
.big{background:var(--pink);color:#0b0b10;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:800}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:10px;font-size:14px}
.ring{position:relative;width:220px;height:220px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .bg{stroke:var(--line)}#arc{stroke:var(--pink);transition:stroke-dashoffset .2s}
.num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num b{font-size:64px;line-height:1}.num small{color:var(--mute);font-size:16px}
h2{text-align:center;margin:0;font-size:24px}.sw{color:var(--mute);font-size:14px;text-align:center}
.stars{text-align:center;font-size:42px;color:var(--pink)}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;background:rgba(0,0,0,.55)}
.small{width:150px;height:150px}.small .num b{font-size:44px}
</style></head>

const E=[["Sentadillas","r",8,"Espalda recta y baja con control."],["Zancadas","r",6,"Rodilla alineada con la punta del pie."],["Flexiones","r",5,"Cuerpo en línea, abdomen firme."],["Plancha","s",15,"Abdomen activo y respira constante."],["Jumping jacks","r",15,"Aterriza suave en las puntas."],["Puente de glúteo","r",10,"Aprieta arriba un segundo."],["Escaladores","r",16,"Cadera estable, ritmo constante."]];
const OUT=[["Rosa",1,"#ff3d8f"],["Teal",3,"#1fc7b6"],["Morado",5,"#9b6bff"],["Blanco",7,"#f0f0f5"]];
const PH=["¡Hoy entrenamos con propósito!","Constancia antes que perfección.","Un nivel más, una versión más fuerte.","Respira, mueve, repite. ¡Tú puedes!"];
const $=s=>document.querySelector(s);
let S={xp:0,max:0,out:0},W=null,tm=null,sens=false,lastM=0;
try{Object.assign(S,JSON.parse(localStorage.getItem("aq")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("aq",JSON.stringify(S))}catch(e){}};
const accent=()=>document.documentElement.style.setProperty("--pink",(OUT[S.out]||OUT[0])[2]);
const hd=t=>`<header><img class=av src="${AV}" alt="Alcy"><div><b>AlcyAIFit Quest</b><small>${t}</small></div></header>`;
const plan=n=>[0,1,2].map(k=>{const e=E[(n*2+k)%7];return{n:e[0],t:e[1],g:e[1]=="r"?e[2]+Math.floor(n*1.5):e[2]+n*5,tip:e[3]}});

function home(){accent();const L=Math.min(S.max+1,10);
$("#app").innerHTML=hd(`XP ${S.xp} · Nivel ${L}`)+
`<div class=bub>${PH[S.max%PH.length]}</div>
<div class=chips>${OUT.map((o,i)=>{const lk=S.max+1<o[1];return `<button class="chip ${i==S.out?"on":""}" ${lk?"disabled":""} style="--c:${o[2]}" onclick="pick(${i})">${lk?"🔒 Nivel "+o[1]:o[0]}</button>`}).join("")}</div>
<div class=map>${Array.from({length:10},(_,i)=>{const n=i+1,st=n<=S.max?"done":n==L?"now":"lock";return `<button class="lv ${st}" ${st=="lock"?"disabled":""} onclick="start(${n})">${st=="done"?"★":n}</button>`}).join("")}</div>
<button class=big onclick="start(${L},true)">📷 Entrenar nivel ${L} con cámara</button>
<button class=ghost onclick="start(${L})">Entrenar manual</button>
<button class=ghost onclick="reset(this)">Reiniciar progreso</button>`}
function pick(i){S.out=i;save();home()}
function reset(b){if(!b.dataset.s){b.dataset.s=1;b.textContent="Toca otra vez para borrar";return}S={xp:0,max:0,out:0};save();home()}
async function start(n,auto){W={L:n,i:0,c:0,run:false,ex:plan(n),auto:!!auto};if(!auto)return work();
try{await camOn()}catch(e){W=null;home();$("#app").insertAdjacentHTML("afterbegin",`<div class=bub>No pude abrir la cámara (${e.name}). Acepta el permiso o abre el enlace directo en Chrome o Safari.</div>`);return}
autoUI();aStart();loop()}

function work(){const x=W.ex[W.i],p=Math.min(W.c/x.g,1),C=(2*Math.PI*54).toFixed(1);
$("#app").innerHTML=hd(`Nivel ${W.L} · Ejercicio ${W.i+1}/3`)+
`<div class=bub>${x.tip}</div>
<div class=ring><svg viewBox="0 0 120 120"><circle class=bg cx=60 cy=60 r=54></circle><circle id=arc cx=60 cy=60 r=54 stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"></circle></svg><div class=num><b>${W.c}</b><small>de ${x.g}${x.t=="s"?" seg":""}</small></div></div>
<h2>${x.n}</h2>`+
(x.t=="r"?`<button class=big onclick="rep()">+1 REPETICIÓN</button><label class=sw><input type=checkbox ${sens?"checked":""} onchange="setSens(this.checked)"> Contar con sensor de movimiento</label>`
:`<button class=big onclick="plank()">${W.run?"Pausar":"Iniciar plancha"}</button>`)+
`<button class=ghost onclick="rep(99)">Completar ejercicio (modo prueba)</button><button class=ghost onclick="quit()">Salir</button>`}
function rep(n){const x=W.ex[W.i];W.c=Math.min(W.c+(n||1),x.g);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}W.c>=x.g?nextEx():work()}
function plank(){if(W.run){clearInterval(tm);W.run=false}else{W.run=true;tm=setInterval(()=>{W.c++;W.c>=W.ex[W.i].g?nextEx():work()},1000)}work()}
function nextEx(){clearInterval(tm);W.run=false;W.i++;W.c=0;W.i>=3?done():work()}
function quit(){clearInterval(tm);camOff();W=null;home()}
function setSens(on){sens=on;if(!on){removeEventListener("devicemotion",mot);return}
const go=()=>addEventListener("devicemotion",mot),D=window.DeviceMotionEvent;
if(D&&D.requestPermission)D.requestPermission().then(r=>r=="granted"?go():(sens=false,work())).catch(()=>{sens=false;work()});else go()}
function mot(e){const a=e.accelerationIncludingGravity;if(!a||!W||W.ex[W.i].t!="r")return;const m=Math.hypot(a.x||0,a.y||0,a.z||0),t=Date.now();if(m>16&&t-lastM>700){lastM=t;rep()}}

function done(){const g=50+W.L*10,nu=OUT.find(o=>o[1]==W.L+1);
if(W.L>S.max)S.max=W.L;S.xp+=g;save();
$("#app").innerHTML=hd("¡Nivel completado!")+
`<div class=stars>★★★</div><h2>+${g} XP</h2>
<div class=bub>¡Increíble trabajo! Hoy diste un paso más hacia tu mejor versión.${nu?`<br><br>🎉 Desbloqueaste el outfit <b>${nu[0]}</b>.`:""}</div>
<button class=big onclick="home()">Continuar</button>`;W=null}
// ===== Modo automático con cámara: detección de movimiento (sin modelos externos) =====
let V=null,stream=null,raf=0,lt=0;
async function camOn(){if(stream)return;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
V=document.createElement("video");V.setAttribute("playsinline","");V.muted=true;V.srcObject=stream;await V.play()}
function camOff(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;V=null}
const cv=document.createElement("canvas");cv.width=48;cv.height=36;const cx=cv.getContext("2d",{willReadFrequently:true});
let prev=null,sm=.5,ext=.5,dir=0,lastRep=0;
const mv={reset(){prev=null;dir=0;lastRep=performance.now()},
step(){cx.drawImage(V,0,0,48,36);const d=cx.getImageData(0,0,48,36).data,n=[];
for(let i=0;i<d.length;i+=4)n.push((d[i]+d[i+1]+d[i+2])/3);
let s=0,sy=0;if(prev)for(let k=0;k<n.length;k++)if(Math.abs(n[k]-prev[k])>22){s++;sy+=Math.floor(k/48)}
prev=n;if(s<12)return false;
const y=sy/s/36,A=($("#sens")?+$("#sens").value:6)/100;sm=sm*.7+y*.3;
if(dir==0){ext=sm;dir=1;return false}
if(dir>0){if(sm>ext)ext=sm;else if(ext-sm>A){dir=-1;ext=sm}}
else{if(sm<ext)ext=sm;else if(sm-ext>A){dir=1;ext=sm;const t=performance.now();if(t-lastRep>450){lastRep=t;return true}}}
return false}};
function loop(){raf=requestAnimationFrame(loop);const t=performance.now();if(t-lt<80||!V||!W||!W.auto)return;lt=t;
if(W.ph=="go"&&W.ex[W.i].t=="r"&&mv.step()){W.c++;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}W.c>=W.ex[W.i].g?aNext():aUpd()}}
function autoUI(){$("#app").innerHTML=hd("Modo automático")+`<div class=cam id=cam><div class=cnt id=cnt></div></div><div class=bub id=msg></div><div class="ring small"><svg viewBox="0 0 120 120"><circle class=bg cx=60 cy=60 r=54></circle><circle id=arc cx=60 cy=60 r=54 stroke-dasharray="339.3" stroke-dashoffset="339.3"></circle></svg><div class=num><b id=nb>0</b><small id=ns></small></div></div><h2 id=exn></h2><label class=sw>Sensibilidad <input type=range id=sens min=2 max=12 value=6></label><button class=ghost onclick="quit()">Salir</button>`;
$("#cam").prepend(V);V.play().catch(()=>{})}
function aStart(){clearInterval(tm);W.ph="prep";W.t=W.i?3:5;W.c=0;mv.reset();aUpd();tm=setInterval(aTick,1000)}
function aTick(){if(W.ph=="prep"){if(--W.t<=0){W.ph="go";mv.reset()}}
else if(W.ph=="go"){if(W.ex[W.i].t=="s"&&++W.c>=W.ex[W.i].g)return aNext()}
else if(--W.t<=0)return aStart();aUpd()}
function aNext(){clearInterval(tm);W.i++;if(W.i>=3){camOff();return done()}W.ph="rest";W.t=5;W.c=0;aUpd();tm=setInterval(aTick,1000)}
function aUpd(){const x=W.ex[W.i],o=$("#cnt");if(!o)return;o.style.display=W.ph=="go"?"none":"flex";o.textContent=W.t;
$("#exn").textContent=x.n;
$("#msg").textContent=W.ph=="prep"?"Prepárate frente a la cámara. "+x.tip:W.ph=="rest"?"¡Bien! Descansa. Sigue: "+x.n:(x.t=="r"?"¡Ya! Yo cuento tus repeticiones.":"Mantén la posición, yo llevo el tiempo.");
$("#nb").textContent=W.c;$("#ns").textContent="de "+x.g+(x.t=="s"?" seg":"");
$("#arc").style.strokeDashoffset=339.3*(1-Math.min(W.c/x.g,1))}
home();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
